<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piper TTS Web</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { margin-bottom: 20px; color: #333; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: 600; color: #555; }
        select, textarea, button { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        textarea { min-height: 150px; font-family: inherit; resize: vertical; }
        button { background: #007bff; color: white; border: none; cursor: pointer; margin-top: 15px; font-weight: 600; }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .status { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; }
        .status.processing { display: block; background: #fff3cd; border: 1px solid #ffc107; }
        .status.completed { display: block; background: #d4edda; border: 1px solid #28a745; }
        .status.error { display: block; background: #f8d7da; border: 1px solid #dc3545; }
        .progress { margin-top: 10px; font-weight: 600; }
        .output { margin-top: 15px; }
        .output a { display: inline-block; margin-right: 10px; padding: 8px 15px; background: #28a745; color: white; text-decoration: none; border-radius: 4px; }
        .output a:hover { background: #218838; }
        .log-section { margin-top: 30px; }
        .log-box { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 4px; max-height: 300px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Piper TTS - Vietnamese Text to Speech</h1>
        
        <label for="model">Chọn Model:</label>
        <select id="model">
            <option value="">Đang tải...</option>
        </select>
        
        <label for="text">Văn bản (sẽ tự động chia thành câu ngắn):</label>
        <textarea id="text" placeholder="Nhập văn bản cần chuyển thành giọng nói..."></textarea>
        
        <button id="submit">Tạo giọng nói</button>
        
        <div id="status" class="status">
            <div class="progress"></div>
            <div class="output"></div>
        </div>
        
        <div class="log-section">
            <label>Piper Log (tự động cập nhật):</label>
            <div id="log" class="log-box">Chưa có log...</div>
        </div>
    </div>

    <script>
        const modelSelect = document.getElementById('model');
        const textArea = document.getElementById('text');
        const submitBtn = document.getElementById('submit');
        const statusDiv = document.getElementById('status');
        const logBox = document.getElementById('log');
        
        let polling = null;
        
        // Load models
        fetch('/api/models')
            .then(r => r.json())
            .then(models => {
                modelSelect.innerHTML = models.map(m => `<option value="${m}">${m}</option>`).join('');
            });
        
        // Submit
        submitBtn.addEventListener('click', async () => {
            const text = textArea.value.trim();
            const model = modelSelect.value;
            
            if (!text || !model) {
                alert('Vui lòng nhập văn bản và chọn model');
                return;
            }
            
            submitBtn.disabled = true;
            statusDiv.className = 'status processing';
            statusDiv.querySelector('.progress').textContent = 'Đang xử lý...';
            statusDiv.querySelector('.output').innerHTML = '';
            
            try {
                const resp = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, model })
                });
                
                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.error || 'Unknown error');
                }
                
                // Start polling status
                startPolling();
                
            } catch (e) {
                statusDiv.className = 'status error';
                statusDiv.querySelector('.progress').textContent = 'Lỗi: ' + e.message;
                submitBtn.disabled = false;
            }
        });
        
        function startPolling() {
            if (polling) clearInterval(polling);
            
            polling = setInterval(async () => {
                try {
                    const resp = await fetch('/api/status');
                    const data = await resp.json();
                    
                    if (data.status === 'idle') {
                        return;
                    }
                    
                    if (data.status === 'processing') {
                        const prog = data.progress || 0;
                        const total = data.total || 0;
                        statusDiv.querySelector('.progress').textContent = 
                            `Đang xử lý câu ${prog}/${total}...`;
                    }
                    
                    if (data.status === 'completed') {
                        clearInterval(polling);
                        statusDiv.className = 'status completed';
                        statusDiv.querySelector('.progress').textContent = 'Hoàn thành!';
                        
                        const filename = data.output;
                        statusDiv.querySelector('.output').innerHTML = `
                            <a href="/output/${filename}" download>Tải về</a>
                            <audio controls src="/output/${filename}" style="margin-top:10px; width:100%;"></audio>
                        `;
                        
                        submitBtn.disabled = false;
                    }
                    
                    if (data.status === 'error') {
                        clearInterval(polling);
                        statusDiv.className = 'status error';
                        statusDiv.querySelector('.progress').textContent = 'Lỗi: ' + (data.error || 'Unknown');
                        submitBtn.disabled = false;
                    }
                    
                } catch (e) {
                    console.error('Polling error:', e);
                }
            }, 1000);
        }
        
        // Poll log
        setInterval(async () => {
            try {
                const resp = await fetch('/api/log');
                const data = await resp.json();
                if (data.lines && data.lines.length > 0) {
                    logBox.textContent = data.lines.join('');
                    logBox.scrollTop = logBox.scrollHeight;
                }
            } catch (e) {
                console.error('Log fetch error:', e);
            }
        }, 2000);
    </script>
</body>
</html>
